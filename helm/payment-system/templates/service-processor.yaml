apiVersion: v1
kind: Service
metadata:
  name: payment-processor
  labels:
    app.kubernetes.io/name: payment-processor
spec:
  type: {{ .Values.processor.service.type }}
  selector:
    app.kubernetes.io/name: payment-processor
  ports:
    - protocol: TCP
      port: {{ .Values.processor.service.port }}
      targetPort: 8080
