apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: payment-config
data:
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  REQUEST_TIMEOUT_S: "3.0"
  CONNECT_TIMEOUT_S: "1.0"
  MAX_RETRIES: "2"
  BACKOFF_BASE_S: "0.1"
  DECLINE_OVER: "1000000"
  FAILURE_RATE: "0"
  LATENCY_MS: "0"
