# Global / Shared config
global:
  serviceToken: "dev-shared-secret-change-me"
  logLevel: "INFO"

# Gateway Configuration
gateway:
  replicaCount: 2
  image:
    repository: rajatg/payment-gateway
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Processor Configuration
processor:
  replicaCount: 2
  image:
    repository: rajatg/payment-processor
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
