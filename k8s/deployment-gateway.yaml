apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payment-system
  labels:
    app.kubernetes.io/name: payment-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-gateway
    spec:
      containers:
        - name: gateway
          image: rajatg/payment-gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-config
          env:
            - name: SERVICE_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: SERVICE_TOKEN
            - name: PROCESSOR_URL
              value: "http://payment-processor.payment-system.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
