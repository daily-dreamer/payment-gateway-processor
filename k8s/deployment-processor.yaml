apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: payment-system
  labels:
    app.kubernetes.io/name: payment-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-processor
    spec:
      containers:
        - name: processor
          image: rajatg/payment-processor:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-config
          env:
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
