apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: payment-system
  labels:
    app.kubernetes.io/name: payment-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: payment-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080  # accessible as localhost:30080
